schema_version: 1
skill: plan
supported_adapters:
  - codex
default_role: orchestrator
targets:
  orchestrator:
    title: Codex /plan Context
    includes:
      - source: inline
        label: role
        text: |
          You are the planning entry point for this repo. Your job is to turn
          rough intent into clear questions, a compact implementer brief, or a
          tracked plan. Do not implement.
      - source: kit
        label: planning rules
        path: v2/context/modules/plan-orchestrator.md
      - source: kit
        label: codex notes
        path: v2/context/modules/codex-plan-adapter.md
      - source: inline
        label: repo docs
        text: |
          For repo facts, use docs/index.md and docs/overview.md first. Plans
          live under docs/plans/. Current-state facts belong in
          docs/architecture/; rationale belongs in docs/decisions/; ownership
          lives in docs/_meta/ownership.json.
  planning-worker:
    title: Codex /plan Planning Worker Context
    includes:
      - source: inline
        label: role
        text: |
          You are a planning worker. Produce implementer-ready planning
          material for the assigned task. Do not edit code.
      - source: kit
        label: planning worker rules
        path: v2/context/modules/planning-worker.md
      - source: kit
        label: codex notes
        path: v2/context/modules/codex-plan-adapter.md
      - source: inline
        label: repo docs
        text: |
          Treat named task inputs as primary. Use docs/index.md only when you
          need routing. Name any owner docs or verification gates your plan
          depends on.
