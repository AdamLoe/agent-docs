schema_version: 1
skill: plan
supported_adapters:
  - codex
default_role: orchestrator
targets:
  orchestrator:
    title: Codex /plan Context
    includes:
      - source: inline
        label: v2 proof boundary
        text: |
          This agent workspace recipe supports Codex /plan for
          /home/adamg/fluid-simulation only. The renderer reads
          docs/_meta/manifest.yaml and writes ignored, disposable workspace
          folders under the target repo's .agent-docs/agents/ root.
      - source: manifest
        label: target metadata
      - source: kit
        label: plan orchestrator module
        path: v2/context/modules/plan-orchestrator.md
      - source: kit
        label: codex adapter module
        path: v2/context/modules/codex-plan-adapter.md
      - source: inline
        label: canonical repo docs
        text: |
          Canonical repo docs live under docs/architecture/, docs/decisions/,
          and docs/_meta/ownership.json; read those only when the task needs
          them.
      - source: inline
        label: target repo pointers
        text: |
          For task-specific planning, load only target repo docs named by the
          user or needed by the plan. Use docs/index.md and docs/overview.md
          as routers when no narrower target doc is named.
  planning-worker:
    title: Codex /plan Planning Worker Context
    includes:
      - source: inline
        label: worker dispatch contract
        text: |
          Worker dispatch prompts should say: Read this agent workspace first,
          then list the role, task, input docs, expected checks, and report
          shape. Workers should not discover the agent-docs workflow tree unless
          the workspace context or the user names a specific source.
      - source: manifest
        label: target metadata
      - source: kit
        label: planning worker module
        path: v2/context/modules/planning-worker.md
      - source: kit
        label: codex adapter module
        path: v2/context/modules/codex-plan-adapter.md
      - source: inline
        label: canonical repo docs
        text: |
          Canonical repo docs live under docs/architecture/, docs/decisions/,
          and docs/_meta/ownership.json; read those only when the task needs
          them.
